---
- name: Create SQL Cluster Service Account
  hosts: dc
  gather_facts: no
  vars:
    csa_name: "sql_svc"
    csa_password: "{{ ansible_password }}"

  tasks:
    - name: Create the service account in AD
      win_domain_user:
        name: "{{ csa_name }}"
        password: "{{ csa_password }}"
        state: present
        groups:
          - Domain Admins
        password_never_expires: yes

- name: Grant Service Account Local Admin on SQL Nodes
  hosts: sql_nodes
  vars:
    csa_name: "sql_svc" # Added here so this play knows the name
  tasks:
    - name: Add sql_svc to local Administrators group
      win_group_membership:
        name: Administrators
        members:
          - "ILAB\\{{ csa_name }}"
        state: present