---
- name: Fresh Deployment of HAProxy Cluster
  hosts: haproxy
  become: yes
  tasks:
    - name: 1. Install System Dependencies
      apt:
        name: [haproxy, keepalived, socat, curl, psmisc]
        state: present
        update_cache: yes
        cache_valid_time: 3600
      register: apt_action
      retries: 3
      delay: 5
      until: apt_action is success

    - name: 2. Allow Non-Local IP Binding
      sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        reload: yes

    - name: 3. Deploy HAProxy Config
      template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: haproxy
        group: haproxy
        mode: '0644'

    - name: 4. Deploy Keepalived Config
      template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: '0644'
      vars:
        keepalived_auth_pass: "{{ lookup('community.general.bitwarden', 'haproxy-ansible', field='keepalived_auth_pass') }}"

    - name: 5. Start HAProxy Service
      service:
        name: haproxy
        state: restarted
        enabled: yes

    - name: 6. Start Keepalived Service
      service:
        name: keepalived
        state: restarted
        enabled: yes