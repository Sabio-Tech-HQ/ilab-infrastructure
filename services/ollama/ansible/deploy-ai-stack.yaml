- name: Deploy AI Stack (OpenRouter & Open WebUI) via Docker
  hosts: ollama
  become: yes

  vars:
    ai_base_dir: "/opt/ai-stack"
    proxmox_host: "10.10.10.101"

    groq_api_key: "{{ (query('community.general.bitwarden', 'ollama-ansible', field='GROQ_API_KEY') | flatten)[0] | default('') }}"
    groq_api_key2: "{{ (query('community.general.bitwarden', 'ollama-ansible', field='GROQ_API_KEY2', errors='ignore') | flatten)[0] | default('') }}"
    gemini_api_key: "{{ (query('community.general.bitwarden', 'ollama-ansible', field='GEMINI_API_KEY') | flatten)[0] | default('') }}"
    openrouter_api_key: "{{ (query('community.general.bitwarden', 'ollama-ansible', field='OPENROUTER_API_KEY') | flatten)[0] | default('') }}"
    proxmox_token_name: "{{ (query('community.general.bitwarden', 'ollama-ansible', field='proxmox_token_name') | flatten)[0] | default('') }}"
    proxmox_token_secret: "{{ (query('community.general.bitwarden', 'ollama-ansible', field='proxmox_token_secret') | flatten)[0] | default('') }}"

  tasks:
    - name: Ensure dependency prerequisites are installed
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create directory for Docker official GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0444'

    - name: Add Docker repository to Apt sources
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Ensure Docker engine and compose plugin are installed
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: restarted
        enabled: yes

    - name: Wait for Docker socket to become available
      wait_for:
        path: /var/run/docker.sock
        timeout: 10

    - name: Add deployment user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Create base directory for AI stack
      file:
        path: "{{ ai_base_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Remove stale config.json directory if it exists
      file:
        path: "{{ ai_base_dir }}/config.json"
        state: absent

    - name: Deploy MCPO config.json for Proxmox MCP
      copy:
        dest: "{{ ai_base_dir }}/config.json"
        content: |
          {
            "mcpServers": {
              "proxmox": {
                "command": "uvx",
                "args": ["mcp-server-proxmox"],
                "env": {
                  "PVE_HOST": "{{ proxmox_host }}",
                  "PVE_PORT": "8006",
                  "PVE_USER": "root@pam",
                  "PVE_TOKEN_ID": "root@pam!{{ proxmox_token_name }}",
                  "PVE_TOKEN_SECRET": "{{ proxmox_token_secret }}",
                  "PVE_VERIFY_SSL": "false"
                }
              }
            }
          }
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Deploy Docker Compose configuration file
      copy:
        dest: "{{ ai_base_dir }}/docker-compose.yml"
        content: |
          services:
            ollama:
              image: ollama/ollama:latest
              container_name: ollama
              restart: unless-stopped
              ports:
                - "11434:11434"
              volumes:
                - ollama_data:/root/.ollama
              environment:
                - OLLAMA_HOST=0.0.0.0
                - OLLAMA_NUM_THREADS=16

            mcpo:
              image: ghcr.io/open-webui/mcpo:main
              container_name: mcpo
              restart: unless-stopped
              command: mcpo --port 8000 --host 0.0.0.0 --config /app/config.json
              ports:
                - "8000:8000"
              volumes:
                - ./config.json:/app/config.json

            open-webui:
              image: ghcr.io/open-webui/open-webui:main
              container_name: open-webui
              restart: unless-stopped
              ports:
                - "3000:8080"
              environment:
                - OLLAMA_BASE_URL=http://ollama:11434
                - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
                - OPENAI_API_KEY={{ openrouter_api_key }}
                - OPENROUTER_API_KEY={{ openrouter_api_key }}
                - GROQ_API_KEY={{ groq_api_key }}
                - GROQ_API_KEY2={{ groq_api_key2 }}
                - GEMINI_API_KEY={{ gemini_api_key }}
                - WEBUI_SECRET_KEY=ilab_secure_static_key_do_not_change_2026
                - ENABLE_MCP=true
              volumes:
                - open_webui_data:/app/backend/data
              depends_on:
                - ollama
                - mcpo

          volumes:
            ollama_data:
            open_webui_data:
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Ensure Docker compose plugin is updated to latest version
      apt:
        name: docker-compose-plugin
        state: latest
        update_cache: yes

    - name: Force recreate AI stack containers via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ ai_base_dir }}"
        state: present
        recreate: always
      become: yes