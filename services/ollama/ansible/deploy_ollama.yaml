---
- name: Configure Ollama with Qwen 2.5 Coder
  hosts: ollama
  remote_user: jthairu
  become: yes

  tasks:
    - name: Ensure required dependencies are installed
      apt:
        name: 
          - curl
          - zstd
        state: present
        update_cache: yes

    - name: Install Ollama via official installer
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama

    - name: Create systemd override directory for Ollama
      file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Bind Ollama to listen on 0.0.0.0
      copy:
        dest: /etc/systemd/system/ollama.service.d/override.conf
        content: |
          [Service]
          Environment="OLLAMA_HOST=0.0.0.0"
        owner: root
        group: root
        mode: '0644'
      notify: Restart Ollama

    - name: Ensure Ollama service is enabled and active
      systemd:
        name: ollama
        state: started
        enabled: yes

    - name: Pull Qwen 2.5 Coder 14B model
      command: ollama pull qwen2.5-coder:14b
      register: pull_result
      changed_when: "'success' in pull_result.stdout"

  handlers:
    - name: Restart Ollama
      systemd:
        daemon_reload: yes
        name: ollama
        state: restarted