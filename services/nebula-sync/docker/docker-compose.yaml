services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    logging:
      driver: loki
      options:
        loki-url: "http://10.10.10.90:3100/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    container_name: nebula-sync
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - PRIMARY=${PRIMARY_URL}|${PRIMARY_PASSWORD}
      - REPLICAS=${REPLICA_1_URL}|${REPLICA_1_PASSWORD},${REPLICA_2_URL}|${REPLICA_2_PASSWORD}
      - FULL_SYNC=true
      - RUN_GRAVITY=true
      - CRON=0 * * * *