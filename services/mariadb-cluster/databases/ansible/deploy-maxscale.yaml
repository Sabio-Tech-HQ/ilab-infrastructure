---
- name: Install and Configure MariaDB MaxScale
  hosts: maxscale
  become: yes
  vars_files:
    - "../../../ansible/group_vars/all/vars.yml"
    - "../../../ansible/group_vars/all/vault.yml"

  tasks:
    - name: Install prerequisites
      apt:
        name: 
          - curl
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Add MariaDB Repository (includes MaxScale)
      shell: curl -sSL https://downloads.mariadb.com/MariaDB/mariadb_repo_setup | bash -s -- --mariadb-maxscale-version=23.08
      args:
        creates: /etc/apt/sources.list.d/mariadb.list

    - name: Install MaxScale
      apt:
        name: maxscale
        state: present
        update_cache: yes

    - name: Configure maxscale.cnf
      copy:
        dest: /etc/maxscale.cnf
        owner: root
        group: root
        mode: '0644'
        content: |
          [maxscale]
          threads=auto
          admin_host=0.0.0.0
          admin_port=8989
          admin_secure_gui=false

          # --- BACKEND SERVERS ---
          [mariadb-01]
          type=server
          address=10.10.10.41
          port=3306
          protocol=MariaDBBackend

          [mariadb-02]
          type=server
          address=10.10.10.42
          port=3306
          protocol=MariaDBBackend

          [mariadb-03]
          type=server
          address=10.10.10.43
          port=3306
          protocol=MariaDBBackend

          # --- CLUSTER MONITOR ---
          [MariaDB-Monitor]
          type=monitor
          module=mariadbmon
          servers=mariadb-01,mariadb-02,mariadb-03
          user=maxscale_mon
          password={{ maxscale_mon_password }}
          monitor_interval=2s

          # --- ROUTING SERVICE ---
          [Read-Write-Service]
          type=service
          router=readwritesplit
          servers=mariadb-01,mariadb-02,mariadb-03
          user=maxscale_mon
          password={{ maxscale_mon_password }}

          # --- APPLICATION LISTENER ---
          [Read-Write-Listener]
          type=listener
          service=Read-Write-Service
          protocol=MariaDBClient
          port=3306
      notify: Restart MaxScale

    - name: Ensure MaxScale is running and enabled
      service:
        name: maxscale
        state: started
        enabled: yes

  handlers:
    - name: Restart MaxScale
      service:
        name: maxscale
        state: restarted