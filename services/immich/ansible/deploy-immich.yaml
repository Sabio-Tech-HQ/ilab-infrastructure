- name: Provision Immich Environment
  hosts: immich
  become: yes
  gather_facts: yes

  vars:
    immich_root: /opt/immich
    photos_mount: /mnt/photos
    immich_tag: release

  tasks:
    - name: Ensure jthairu user exists
      user:
        name: jthairu
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present

    - name: Add SSH key for jthairu
      authorized_key:
        user: jthairu
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Update apt cache and upgrade packages
      apt:
        upgrade: dist
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name: [curl, ca-certificates]
        state: present

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: jtnas photo bind mount visible
      stat:
        path: "{{ photos_mount }}"
      register: photos_dir
      failed_when: not photos_dir.stat.exists

    - name: Create immich directories
      file:
        path: "{{ immich_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - ""
        - library
        - postgres
        - model-cache

    - name: Generate .env with random DB password if missing
      shell: |
        echo "DB_PASSWORD=$(openssl rand -hex 24)" > {{ immich_root }}/.env
      args:
        creates: "{{ immich_root }}/.env"

    - name: Deploy docker-compose.yml
      copy:
        dest: "{{ immich_root }}/docker-compose.yml"
        mode: "0644"
        content: |
          name: immich
          services:
            immich-server:
              container_name: immich_server
              image: ghcr.io/immich-app/immich-server:{{ immich_tag }}
              volumes:
                - {{ immich_root }}/library:/usr/src/app/upload
                - {{ photos_mount }}:/mnt/photos:ro
                - /etc/localtime:/etc/localtime:ro
              environment:
                IMMICH_WORKERS_INCLUDE: api,microservices
                DB_PASSWORD: $${DB_PASSWORD}
              env_file: {{ immich_root }}/.env
              ports:
                - "2283:2283"
              depends_on:
                - redis
                - database
              restart: unless-stopped

            immich-machine-learning:
              container_name: immich_machine_learning
              image: ghcr.io/immich-app/immich-machine-learning:{{ immich_tag }}
              volumes:
                - {{ immich_root }}/model-cache:/cache
              env_file: {{ immich_root }}/.env
              restart: unless-stopped

            redis:
              container_name: immich_redis
              image: redis:6.2-alpine
              restart: unless-stopped

            database:
              container_name: immich_postgres
              image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3
              environment:
                POSTGRES_PASSWORD: $${DB_PASSWORD}
                POSTGRES_USER: postgres
                POSTGRES_DB: immich
                POSTGRES_INITDB_ARGS: --data-checksums
              volumes:
                - {{ immich_root }}/postgres:/var/lib/postgresql/data
              shm_size: 128mb
              restart: unless-stopped

    - name: Immich stack up
      community.docker.docker_compose_v2:
        project_src: "{{ immich_root }}"
        pull: missing
        state: present

    - name: Wait for immich API
      uri:
        url: "http://localhost:2283/api/server/ping"
        status_code: 200
      register: ping
      until: ping.status == 200
      retries: 30
      delay: 10
