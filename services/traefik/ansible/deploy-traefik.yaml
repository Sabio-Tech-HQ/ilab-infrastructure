- name: Configure Keepalived for Traefik VIP
  hosts: traefik_nodes
  become: true
  vars_files:
    - "../../../ansible/group_vars/all/vars.yml"
  tasks:
    - name: Install keepalived and iputils/iproute tools
      ansible.builtin.apt:
        name:
          - keepalived
          - iproute2
          - iputils-ping
          - rsync
        state: present
        update_cache: yes

    - name: Disable UFW firewall completely
      community.general.ufw:
        state: disabled

    - name: Allow Keepalived to bind to non-local IP
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        reload: yes

    - name: Configure keepalived.conf
      ansible.builtin.template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        mode: '0644'
      notify: Restart keepalived
      vars:
        traefik_auth_password: "{{ lookup('community.general.bitwarden', 'traefik-ansible', field='traefik_auth_password') }}"

    - name: Ensure keepalived is started and enabled
      ansible.builtin.service:
        name: keepalived
        state: started
        enabled: yes

  handlers:
    - name: Restart keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted


- name: Deploy Traefik Cluster
  hosts: traefik_nodes
  become: true
  vars_files:  
    - "../../../ansible/group_vars/all/vars.yml"
  vars:
    traefik_dir: "/etc/traefik"
    ansible_user_id: "jthairu"

  tasks:
    - name: Ensure user is in the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Reset connection to apply group membership
      ansible.builtin.meta: reset_connection

    - name: Create Traefik directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - "{{ traefik_dir }}"
        - "{{ traefik_dir }}/dynamic"

    - name: Ensure acme.json placeholder exists on primary
      ansible.builtin.file:
        path: "{{ traefik_dir }}/acme.json"
        state: touch
        owner: root
        group: root
        mode: '0600'
      run_once: true
      delegate_to: "{{ groups['traefik_nodes'][0] }}"

    - name: Fetch primary acme.json
      ansible.builtin.fetch:
        src: "{{ traefik_dir }}/acme.json"
        dest: "/tmp/acme.json"
        flat: yes
      run_once: true
      delegate_to: "{{ groups['traefik_nodes'][0] }}"
      ignore_errors: yes

    - name: Check if fetched acme.json exists locally
      ansible.builtin.stat:
        path: "/tmp/acme.json"
      register: fetched_acme
      delegate_to: localhost
      run_once: true

    - name: Distribute acme.json to secondary nodes before startup
      ansible.builtin.copy:
        src: "/tmp/acme.json"
        dest: "{{ traefik_dir }}/acme.json"
        owner: root
        group: root
        mode: '0600'
      when: 
        - inventory_hostname != groups['traefik_nodes'][0]
        - fetched_acme.stat.exists

    - name: Ensure fallback empty acme.json exists on secondary nodes if fetch failed
      ansible.builtin.file:
        path: "{{ traefik_dir }}/acme.json"
        state: touch
        owner: root
        group: root
        mode: '0600'
      when: inventory_hostname != groups['traefik_nodes'][0]

    - name: Deploy Traefik Static Config
      ansible.builtin.template:
        src: templates/traefik.yml.j2
        dest: "{{ traefik_dir }}/traefik.yml"
        mode: '0644'
      vars:
        traefik_acme_email: "{{ lookup('community.general.bitwarden', 'traefik-ansible', field='traefik_acme_email') }}"

    - name: Deploy Traefik Dynamic Config
      ansible.builtin.template:
        src: templates/dynamic_conf.yml.j2
        dest: "{{ traefik_dir }}/dynamic/dynamic_conf.yml"
        mode: '0644'
      vars:
        traefik_auth_password: "{{ lookup('community.general.bitwarden', 'traefik-ansible', field='traefik_auth_password') }}"

    - name: Deploy Docker Compose for Traefik
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ traefik_dir }}/docker-compose.yml"
        mode: '0644'
      vars:
        aws_access_key: "{{ lookup('community.general.bitwarden', 'traefik-ansible', field='aws_access_key')[0] }}"
        aws_secret_key: "{{ lookup('community.general.bitwarden', 'traefik-ansible', field='aws_secret_key')[0] }}"

    - name: Start Traefik containers cluster-wide
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_dir }}"
        state: present
        pull: missing

    - name: Ensure SSH directory exists for root
      ansible.builtin.file:
        path: "/root/.ssh"
        state: directory
        mode: '0700'
      when: inventory_hostname == groups['traefik_nodes'][0]

    - name: Generate SSH key on primary node if missing
      community.crypto.openssh_keypair:
        path: "/root/.ssh/id_rsa"
        type: rsa
        size: 4096
        state: present
      when: inventory_hostname == groups['traefik_nodes'][0]

    - name: Fetch public key from primary node
      ansible.builtin.slurp:
        src: "/root/.ssh/id_rsa.pub"
      register: primary_pubkey
      when: inventory_hostname == groups['traefik_nodes'][0]

    - name: Authorize primary node SSH key on all nodes
      ansible.builtin.authorized_key:
        user: root
        state: present
        key: "{{ hostvars[groups['traefik_nodes'][0]]['primary_pubkey']['ansible_facts']['slurp'] | default(hostvars[groups['traefik_nodes'][0]]['primary_pubkey']['content'] | b64decode) }}"

    - name: Copy sync script to primary node
      ansible.builtin.template:
        src: templates/sync-acme.sh.j2
        dest: "/usr/local/bin/sync-acme.sh"
        mode: '0700'
      when: inventory_hostname == groups['traefik_nodes'][0]

    - name: Ensure cron package is installed on primary node
      ansible.builtin.apt:
        name: cron
        state: present
      when: inventory_hostname == groups['traefik_nodes'][0]

    - name: Setup hourly cron job for acme sync on primary node
      ansible.builtin.cron:
        name: "Sync Traefik ACME certificates to secondary nodes"
        minute: "0"
        hour: "*"
        job: "/usr/local/bin/sync-acme.sh >/dev/null 2>&1"
        user: root
      when: inventory_hostname == groups['traefik_nodes'][0]