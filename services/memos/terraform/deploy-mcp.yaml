- name: Provision MCP Gateway and Deploy Services
  hosts: mcp_servers
  become: yes

  vars:
    mcp_dir: "/opt/mcp-gateway"
    db_target_ip: "10.10.10.X" # CHANGE THIS to your mdkodb IP

  vars_files:
    - /home/jthairu/ilab-infrastructure/group_vars/vault.yml

  tasks:
    - name: Ensure prerequisites are installed
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: yes

    - name: Install Docker via official convenience script
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Add jthairu user to docker group
      user:
        name: jthairu
        groups: docker
        append: yes

    - name: Create base directory for MCP gateway
      file:
        path: "{{ mcp_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy environment variables file
      copy:
        dest: "{{ mcp_dir }}/.env"
        content: |
          DB_PASSWORD={{ vault_db_password }}
        mode: '0600'

    - name: Deploy Docker Compose for MCP SSE Wrapper
      copy:
        dest: "{{ mcp_dir }}/docker-compose.yml"
        content: |
          services:
            mcp_postgres:
              image: macmee/mcp-stdio-to-sse-wrapper:latest
              container_name: mcp_postgres
              restart: unless-stopped
              ports:
                - "3001:8080"
              env_file:
                - .env
              environment:
                - PORT=8080
                - MCP_SERVER_TO_WRAP=npx -y @modelcontextprotocol/server-postgres postgresql://mdko:$${DB_PASSWORD}@{{ db_target_ip }}:5432/mdkodb
        mode: '0644'

    - name: Start MCP Docker Stack
      community.docker.docker_compose_v2:
        project_src: "{{ mcp_dir }}"
        state: restarted