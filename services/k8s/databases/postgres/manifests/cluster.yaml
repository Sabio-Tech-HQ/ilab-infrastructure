apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: default
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: local-path   
  bootstrap:
    initdb:
      database: app_db
      owner: app_user
      secret:
        name: postgres-app-secret
  superuserSecret:
    name: postgres-superuser
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-vip
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    cnpg.io/cluster: postgres-cluster
    role: primary