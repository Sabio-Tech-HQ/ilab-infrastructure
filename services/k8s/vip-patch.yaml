apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: talos-vip-patcher
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: talos-vip-patcher
  template:
    metadata:
      labels:
        name: talos-vip-patcher
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: patcher
        image: alpine:latest
        command: ["sh", "-c", "apk add --no-cache curl && echo 'Patcher ready' && sleep infinity"]
